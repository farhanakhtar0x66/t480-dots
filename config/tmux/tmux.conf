# Minimal charcoal status line
set -g default-terminal "tmux-256color"
set -as terminal-features ',st*:RGB:clipboard'
set -g set-clipboard on
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{pane_current_command}}'

unbind C-b
set -g prefix C-a
bind C-a send-prefix
unbind '"'
unbind %
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind h previous-window
bind l next-window
bind Space last-window
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard -i'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard -i'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard -i'

set -g status-position top
set -g status-style 'bg=#151515,fg=#a0a0a0'
set -g status-left-length 30
set -g status-left ' #S │ '
set -g status-right ' │ %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-current-style 'fg=#e0e0e0,bg=#353535,bold'
set -g pane-border-style 'fg=#353535'
set -g pane-active-border-style 'fg=#bdbdbd'
set -g message-style 'bg=#353535,fg=#e0e0e0'
